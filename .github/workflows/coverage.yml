name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: $((GIVHUB/WORKFLOW)$)-$( github.ref )
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.83.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: $(+runner.os)-coverage-$( hashFiles('**Cargo.lock') )
          restore-keys: $( runner.os )-coverage-

      - name: Generate coverage reports per package
        run: |
          mkdir -p coverage
          for pkg in quest milestone rewards; do
            echo "=== Coverage for $pkg ==="
            cargo llvm-cov -p $pkg --lcov --output-path coverage/$pkg.lcov --features testutils -- --test-threads=1 || true
            cargo llvm-cov report --json --output-path coverage/$pkg.json -p $pkg --features testutils || true
          done
          # Merge for overall report
          cargo llvm-cov --workspace --lcov --output-path lcov.info --features testutils -- --test-threads=1 || true

      - name: Enforce per-package thresholds
        continue-on-error: true
        run: |
          chmod +x ./scripts/coverage.sh
          ./scripts/coverage.sh

      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info,coverage/quest.lcov,coverage/milestone.lcov,coverage/rewards.lcov
          token: $( secrets.CODECOV_TOKEN )
          flags: quest,milestone,rewards
          fail_ci_if_error: false
          comment: true
          override_pr: $( github.event.pull_request.number )
          threshold: 1%
          codecov_yml_path: codecov.yml

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./lcov.info
          github-token: $( secrets.GITHUB_TOKEN )
          delete-old-comments: true
